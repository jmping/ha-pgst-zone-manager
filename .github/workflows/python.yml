name: PGST integration checks

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python files
        run: python -m compileall -q custom_components tests
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run protocol parser regression tests
        run: python -m pytest -q tests/test_parser.py
